# Shared baseline values for the application layer.
# Per-environment files override or extend these.

namespace: bsv-mcast

# Pinned chart versions — each must be a chart version actually PUBLISHED to
# oci://ghcr.io/lightwebinc/charts (a repo's Chart.yaml is typically one ahead of
# what is published; pinning that unreleased version fails the pull). Bump in
# lockstep when releasing new chart artefacts.
chartVersions:
  proxy: "0.7.8"           # appVersion 1.40.1
  listener: "0.8.1"        # appVersion 1.29.1
  retryEndpoint: "0.5.5"   # appVersion 1.12.0 (at or above the v1.9.5 repair-storm floor)
  subtxGenerator: "0.3.6"  # appVersion 0.4.0
  # shard-manifest is intentionally NOT wired into apps/helmfile.yaml.gotmpl (see
  # docs/architecture.md); it runs alongside each participant per-topology.
  # shardManifest: "0.3.4"

# Wire-protocol shared parameters — must agree across all four components
# (same shardBits/scope/groupId/ports on every chart, or frames are emitted
# to groups nobody joins).
shared:
  shardBits: 2
  mcScope: "site"
  mcGroupId: "0x000B"
  dataPort: 9001
  beaconPort: 9300
  fabricIface: "enp5s0"
  # asm (FF0x) is the reference-composition posture: the platform NADs use
  # static IPAM, so publishers have no distinct per-pod source address and the
  # listener DaemonSet cannot hold one at all — both prerequisites for SSM.
  # The charts default to ssm; their schemas do NOT enforce a bindSource, but
  # the binaries fail fast at startup under ssm without one (proxy/retry:
  # bindSource; listener: ssmBootstrap.* or ssmPublishersStatic), so asm must
  # be stated here.
  # For ssm: give each publisher a unique bindSource (dynamic IPAM/Whereabouts),
  # and set ssmPublishersStatic or ssmBootstrap.* on the listener.
  sourceMode: "asm"

# Networking mode for the workload pods (chart value `networking.mode`).
networkingMode: "multus"
multus:
  networkName: "mcast-fabric"

# Fabric IPv6 of every fabric node. The listener DaemonSet uses these to
# populate RETRY_ENDPOINTS via Helm rendering.
retryEndpoints:
  - name: "retry-1"
    nackAddr: "fd20::24"
    tier: 0
    preference: 128
  - name: "retry-2"
    nackAddr: "fd20::25"
    tier: 0
    preference: 64
  - name: "retry-3"
    nackAddr: "fd20::26"
    tier: 1
    preference: 128

# Subtx generator: disabled by default; enable for load testing.
subtxGenerator:
  enabled: false
  mode: "subtx-gen"
  workloadType: "Job"
  pps: 1000
  duration: "30s"
