# Shared baseline values for the application layer.
# Per-environment files override or extend these.

namespace: bsv-mcast

# Pinned chart versions. Bump in lockstep when releasing new chart artefacts.
chartVersions:
  proxy: "0.7.2"
  listener: "0.7.2"
  retryEndpoint: "0.5.1"
  subtxGenerator: "0.3.0"
  # shard-manifest is intentionally NOT wired into apps/helmfile.yaml.gotmpl (see
  # docs/architecture.md); it runs alongside each participant per-topology.
  # Current released chart version: 0.3.1 (shard-manifest-helm).
  # shardManifest: "0.3.1"

# Wire-protocol shared parameters — must agree across all four components
# (same shardBits/scope/groupId/ports on every chart, or frames are emitted
# to groups nobody joins).
shared:
  shardBits: 2
  mcScope: "site"
  mcGroupId: "0x000B"
  dataPort: 9001
  beaconPort: 9300
  fabricIface: "enp5s0"
  # asm (FF0x) is the reference-composition posture: the platform NADs use
  # static IPAM, so publishers have no distinct per-pod source address and the
  # listener DaemonSet cannot hold one at all — both prerequisites for SSM.
  # The charts default to ssm and their schema fails the install when it is set
  # without a bindSource, so this must be stated explicitly here.
  # For ssm: give each publisher a unique bindSource (dynamic IPAM/Whereabouts),
  # and set ssmPublishersStatic or ssmBootstrap.* on the listener.
  sourceMode: "asm"

# Networking mode for the workload pods (chart value `networking.mode`).
networkingMode: "multus"
multus:
  networkName: "mcast-fabric"

# Fabric IPv6 of every fabric node. The listener DaemonSet uses these to
# populate RETRY_ENDPOINTS via Helm rendering.
retryEndpoints:
  - name: "retry-1"
    nackAddr: "fd20::24"
    tier: 0
    preference: 128
  - name: "retry-2"
    nackAddr: "fd20::25"
    tier: 0
    preference: 64
  - name: "retry-3"
    nackAddr: "fd20::26"
    tier: 1
    preference: 128

# Subtx generator: disabled by default; enable for load testing.
subtxGenerator:
  enabled: false
  mode: "subtx-gen"
  workloadType: "Job"
  pps: 1000
  duration: "30s"
