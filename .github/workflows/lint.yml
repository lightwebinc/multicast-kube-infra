name: lint

on:
  # main only: a branch with a PR is covered by the pull_request run, and a
  # bare-branch push alongside it ran this twice per PR.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yamllint + shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install helmfile
        run: |
          curl -sSL -o /tmp/helmfile.tgz \
            https://github.com/helmfile/helmfile/releases/download/v0.169.1/helmfile_0.169.1_linux_amd64.tar.gz
          tar -xzf /tmp/helmfile.tgz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          helmfile init --force
          helm plugin install https://github.com/databus23/helm-diff || true

      - name: Run lint
        run: ./scripts/lint.sh
